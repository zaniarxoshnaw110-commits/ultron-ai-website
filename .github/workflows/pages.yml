name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate required files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          grep -q 'id="core"' index.html
          grep -q 'id="lab"' index.html
          grep -q 'prefers-reduced-motion' styles.css
          grep -q 'NO LIVE AI BACKEND' index.html
          node --check script.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
